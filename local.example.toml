# Copy to local.toml (git-ignored) and change what differs on this Mac.
[model]
weights = "4bit"                                  # or "8bit": the publisher's 8-bit checkpoint (README)

# where `python3 -m mac download` puts each checkpoint
[weights.4bit]
model_dir = "~/models/Ornith-1.5-122B-MLX-4bit"

[weights.8bit]
model_dir = "~/models/Ornith-1.5-122B-MLX-8bit"

[engine]
tensorfold_src = "~/github/TensorFold"            # a clone of github.com/BobClawblaw/TensorFold holding tensorfold_sha
tensorfold_sha = "3b77807c3b36cb837de92d08d804e844cb6e883b"                      # tag ornith-3b77807c3: PRs #1125 + #1799 (README.md)
zig = "zig"

[local]
host = "127.0.0.1"
port = 8891
tf_cache = "~/.cache/ornith-15-122b"
